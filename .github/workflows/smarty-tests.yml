name: Smarty audio regression tests

on:
  push:
    branches: [smarty]
  pull_request:
    branches: [smarty]

permissions:
  contents: read

jobs:
  playback-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.5 requests==2.33.0
      - run: python -m unittest discover -s tests -p test_playback_capture.py -v
      - run: python -m unittest discover -s tests -p test_stop_word.py -v
      - run: python -m unittest discover -s tests -p test_install_wheel.py -v
